name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  NOMAD_VERSION: 2.0.4
  NOMAD_ADDR: http://10.20.1.10:4646

jobs:
  build:
    uses: W4lff/gh-actions-templates/.github/workflows/devsecops-build.yml@main
    with:
      name: lab-docs
      image: ghcr.io/w4lff/lab-docs
      context: .
      node: true
    permissions:
      contents: read
      packages: write
      security-events: write
    secrets: inherit

  tag:
    needs: build
    uses: W4lff/gh-actions-templates/.github/workflows/semantic-tag.yml@main
    permissions:
      contents: write
      models: read

  # Deploy precisa do runner self-hosted: só ele está dentro da VNet e
  # alcança o IP privado do Nomad (10.20.1.10:4646).
  deploy:
    needs: build
    runs-on: [self-hosted, hashicorp-lab]
    steps:
      - uses: actions/checkout@v4

      - name: Instalar nomad CLI
        run: |
          curl -fsSL -o nomad.zip \
            "https://releases.hashicorp.com/nomad/${NOMAD_VERSION}/nomad_${NOMAD_VERSION}_linux_amd64.zip"
          unzip -o nomad.zip -d /usr/local/bin

      - name: Deploy
        run: |
          nomad job validate -var="image_tag=${{ needs.build.outputs.image_tag }}" lab-docs.nomad.hcl
          nomad job run -detach -var="image_tag=${{ needs.build.outputs.image_tag }}" lab-docs.nomad.hcl
