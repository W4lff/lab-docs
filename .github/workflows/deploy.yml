name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  NOMAD_VERSION: 2.0.4
  NOMAD_ADDR: http://10.20.1.10:4646
  # nomes de imagem OCI precisam ser minúsculos — github.repository
  # preserva a capitalização do owner (W4lff), que quebra o docker build
  IMAGE: ghcr.io/w4lff/lab-docs

jobs:
  # Build roda no runner hospedado pelo próprio GitHub — não precisa
  # alcançar a rede privada do lab, só o ghcr.io (público, TLS válido,
  # autenticado com o GITHUB_TOKEN automático, sem senha nenhuma pra
  # gerenciar). Isso tira o build (CPU/tempo) do runner self-hosted, que
  # fica só com o passo que exige de fato a rede interna: o deploy.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login no ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build e push da imagem
        run: |
          docker build -t ${IMAGE}:${{ github.sha }} -t ${IMAGE}:latest .
          docker push ${IMAGE}:${{ github.sha }}
          docker push ${IMAGE}:latest

  # Deploy precisa do runner self-hosted: só ele está dentro da VNet e
  # alcança o IP privado do Nomad (10.20.1.10:4646).
  deploy:
    needs: build
    runs-on: [self-hosted, hashicorp-lab]
    steps:
      - uses: actions/checkout@v4

      - name: Instalar nomad CLI
        run: |
          curl -fsSL -o nomad.zip \
            "https://releases.hashicorp.com/nomad/${NOMAD_VERSION}/nomad_${NOMAD_VERSION}_linux_amd64.zip"
          unzip -o nomad.zip -d /usr/local/bin

      - name: Deploy
        run: |
          nomad job validate -var="image_tag=${{ github.sha }}" lab-docs.nomad.hcl
          nomad job run -detach -var="image_tag=${{ github.sha }}" lab-docs.nomad.hcl
